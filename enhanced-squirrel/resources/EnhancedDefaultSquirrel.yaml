status_icon:
  show: true
style:
  border_height: '-2'
  border_width: '-2'
  candidate_format: '[label] [candidate] [comment]'
  candidate_list_layout: stacked
  color_scheme: codex_space_select
  color_scheme_dark: codex_space_select
  corner_radius: 7
  font_face: Avenir
  font_point: 20
  hilited_corner_radius: 0
  inline_candidate: false
  inline_preedit: false
  label_font_point: 16
  line_spacing: 5
  memorize_size: true
  mutual_exclusive: false
  shadow_size: 0
  show_paging: false
  spacing: 8
  text_orientation: horizontal
  translucency: false
