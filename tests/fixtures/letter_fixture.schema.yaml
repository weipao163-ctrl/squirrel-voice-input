schema:
  schema_id: letter_fixture
  name: Isolated letter selection fixture
  version: "1"
switches:
  - name: ascii_mode
    reset: 0
    states: [Chinese, English]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: letter_fixture
  enable_user_dict: true
  enable_sentence: true
  enable_completion: false
menu:
  page_size: 5
  alternative_select_labels: [①, ②, ③, ④, ⑤, ⑥, ⑦, ⑧, ⑨]
ascii_composer:
  switch_key:
    Shift_L: inline_ascii
    Control_L: noop
    Control_R: noop
    Shift_R: inline_ascii
    Caps_Lock: clear
punctuator:
  half_shape:
    ",": "，"
    ".": "。"
recognizer:
  patterns:
    punct: '^/[a-z]+$'
key_binder:
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: has_menu, accept: comma, send: Page_Up}
    - {when: has_menu, accept: period, send: Page_Down}
